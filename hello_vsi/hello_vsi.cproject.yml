project:

  packs:
    - pack: ARM::CMSIS@6.1.0
    - pack: ARM::CMSIS-RTX@5.9.0
    - pack: ARM::CMSIS-Compiler@2.1.0
    - pack: ARM::CMSIS-View@1.2.0

    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
      for-context: +Corstone_300
    - pack: ARM::V2M_MPS3_SSE_310_BSP@1.4.0
      for-context: +Corstone_310
    - pack: ARM::SSE_315_BSP@1.0.0
      for-context: +Corstone_315
    - pack: ARM::DMA350@1.0.0
      for-context: +Corstone_315
    - pack: ARM::CMSIS-DSP@1.15.0
    - pack: ARM::Cortex_DFP@1.0.0

  processor:
    trustzone: off

  debug: on

  add-path:
    - ./source/application
    - ./source/micro_logger
    - ./source/vsi
    - ./source/vsi/data_sensor
    - ../../CMSIS-CV/CMSIS-CV/Include
    - ../../CMSIS-CV/CMSIS-CV/PrivateInclude

  groups:
    - group: App
      files:
        - file: ./source/application/app.c
        - file: ./source/application/main.c
    - group: Sensor Driver
      files:
        - file: ./source/vsi/data_sensor/sensor_drv.h
        - file: ./source/vsi/data_sensor/sensor_drv.c
    - group: Micro Logger
      files:
        - file: ./source/micro_logger/micro_logger.h
        - file: ./source/micro_logger/micro_logger.c
    - group: cmsiscv
      files:
        - file: ../../CMSIS-CV/CMSIS-CV/Source/arm_cv_common.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/FeatureDetection/arm_cannysobel.c  
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_gaussian.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_sobel_vertical.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_sobel_horizontal.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_linear_common.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_gaussian_5x5.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_gaussian_7x7.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/LinearFilters/arm_gaussian_7x7_32.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_yuv420_to_gray8.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_bgr_8U3C_to_gray8.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_gray8_to_rgb24.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_bgr_8U3C_to_rgb24.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_yuv420_to_rgb24.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ColorTransforms/arm_rgb24_to_gray8.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_crop_gray8.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_crop_rgb24.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_image_resize_bgr_8U3C_f32.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_image_resize_gray8_f32.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_image_resize_common_f32.c
        - file: ../../CMSIS-CV/CMSIS-CV/Source/ImageTransforms/arm_image_resize_bgr_8U3C_to_rgb24_f32.c

  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS Driver:USART
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: ARM::CMSIS:RTOS2:Keil RTX5&Source
    - component: ARM::CMSIS-View:Event Recorder
    - component: ARM::CMSIS-Compiler:CORE
    - component: ARM::CMSIS-Compiler:STDOUT:Custom
    - component: ARM::Device:Definition
    - component: ARM::Device:Native Driver:IO
    - component: ARM::Device:Native Driver:PPC
    - component: ARM::Device:Native Driver:SysCounter
    - component: ARM::Device:Native Driver:SysTimer
    - component: ARM::Device:Native Driver:Timeout
    - component: ARM::Device:Native Driver:UART
    - component: ARM::Device:Startup&C Startup
    - component: ARM::Device:USART Retarget
    - component: ARM::CMSIS:DSP@1.15.0